# Preis-Wächter: schlägt fehl, wenn Firmenprofil oder Webseite nicht zur Preisliste passen.
name: Preise prüfen

on:
  push:
    paths:
      - "portal/app/vertrieb/preisliste.json"
      - "webseite/**"
      - "firma/**"
      - "werkzeuge/**"
      - ".github/workflows/preise.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preise:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preisliste gegen Profil und Webseite prüfen
        run: python3 werkzeuge/preise.py --pruefen
