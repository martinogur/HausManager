# Automatische Tests des Verwaltungsportals (Phase 2: nur Tests, KEIN Deployment).
# Läuft auf kostenlosen GitHub-Runnern; es werden keine Secrets benötigt oder verwendet.
name: Portal-Tests

on:
  push:
    paths:
      - "portal/**"
      - ".github/workflows/portal-tests.yml"
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Schema, Django-Tests, Deploy-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: nur-ci-test
          POSTGRES_DB: hh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hh -d hh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Reine Testwerte für den CI-Container – keine echten Zugangsdaten
      DATABASE_URL: postgresql://hh:nur-ci-test@localhost:5432/hh_ci
      PGCONNECT_TIMEOUT: "10"

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            portal/app/requirements.txt
            portal/app/requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install -r portal/app/requirements-dev.txt

      - name: PostgreSQL-Client prüfen
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql "$DATABASE_URL" -Atc "SELECT version()"

      - name: Schema-Tests (portal/db/tests)
        run: bash portal/db/tests/run-ci.sh

      - name: Django-Tests (pytest)
        working-directory: portal/app
        run: pytest -q

      - name: Migrationen vollständig?
        working-directory: portal/app
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py makemigrations --check --dry-run

      - name: Sicherheits-Check für Produktion (check --deploy)
        working-directory: portal/app
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-nur-zum-testen-6f1b0c8e9a7d4e2f8b3c5a1d0e9f7c6b5a4d3e2f1c0b9a8
          DJANGO_ALLOWED_HOSTS: portal.example.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://portal.example.org
        run: python manage.py check --deploy --fail-level WARNING

  betrieb:
    name: Betriebsdateien prüfen (Skripte, Compose, Image-Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Shell-Skripte prüfen (bash -n, shellcheck)
        run: |
          skripte=(portal/deploy/*.sh portal/deploy/backup/*.sh portal/db/tests/run-ci.sh)
          for s in "${skripte[@]}"; do bash -n "$s"; done
          shellcheck -x "${skripte[@]}"

      - name: docker compose config (mit Platzhalter-Umgebung)
        working-directory: portal/deploy
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Caddyfile prüfen
        run: |
          docker run --rm -e PORTAL_DOMAIN=localhost -e ACME_EMAIL=ci@example.org \
            -v "$PWD/portal/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Image bauen (ohne Veröffentlichung)
        run: |
          docker buildx build --load \
            -f portal/deploy/Dockerfile \
            --build-context db=portal/db \
            -t hh-portal-web:ci portal/app
