name: DealFehler CI

on:
  push:
    paths: ["dealfehler/**", ".github/workflows/dealfehler-ci.yml"]
  pull_request:
    paths: ["dealfehler/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealfehler
          POSTGRES_PASSWORD: dealfehler
          POSTGRES_DB: dealfehler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealfehler" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: dealfehler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Migration gegen leere DB
        env:
          DATABASE_URL: postgresql+psycopg://dealfehler:dealfehler@localhost:5432/dealfehler_test
        run: |
          psql postgresql://dealfehler:dealfehler@localhost:5432/dealfehler_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dealfehler/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
