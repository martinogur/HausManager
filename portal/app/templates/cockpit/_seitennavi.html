{% if seite.has_other_pages %}
<nav class="seitennavi" aria-label="Seiten">
  {% if seite.has_previous %}<a class="knopf zweit klein" href="?{% for k, v in request.GET.items %}{% if k != 'seite' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}seite={{ seite.previous_page_number }}">Zurück</a>{% endif %}
  <span class="stand">Seite {{ seite.number }} von {{ seite.paginator.num_pages }}</span>
  {% if seite.has_next %}<a class="knopf zweit klein" href="?{% for k, v in request.GET.items %}{% if k != 'seite' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}seite={{ seite.next_page_number }}">Weiter</a>{% endif %}
</nav>
{% endif %}
